<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Metas D&D</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#DCE9E7;overflow:hidden}#panel{width:100%;height:100%;border:0;display:block;background:#DCE9E7}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#DCE9E7;color:#0A5F5C;font:700 14px/1.4 system-ui;z-index:20}.loading.hide{display:none}.status{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:30;background:#fff;border:1px solid #EFF4F3;border-radius:999px;padding:9px 13px;font:700 11px/1 system-ui;color:#0A5F5C;box-shadow:0 8px 28px rgba(20,60,55,.14);display:none}.status.on{display:block}.error{max-width:560px;margin:20px;background:#fff;padding:18px 20px;border-radius:16px;color:#b42318;box-shadow:0 18px 50px rgba(20,60,55,.08)}
</style>
</head>
<body>
<div id="loading" class="loading">Carregando seu painel D&D…</div>
<div id="status" class="status"></div>
<iframe id="panel" title="Metas D&D"></iframe>
<script type="module">
import {supabase,getSessionProfile,roleLabel} from './supabase-client.js';
const frame=document.querySelector('#panel'),loading=document.querySelector('#loading'),status=document.querySelector('#status');
const MONTH='2026-05-01', NEXT='2026-06-01', DAY='2026-05-21';
const monthEnd='2026-05-31';
const originalSet=Storage.prototype.setItem;
let profile=null,storeIds={};
function showStatus(t,ms=2200){status.textContent=t;status.classList.add('on');setTimeout(()=>status.classList.remove('on'),ms)}
function fail(msg){loading.innerHTML=`<div class="error"><b>Não foi possível abrir o painel.</b><div style="margin-top:8px;font-weight:500">${msg}</div><div style="margin-top:12px"><a href="./login.html">Voltar ao login</a></div></div>`}
function initials(n){return String(n||'').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'--'}
async function prepare(){
 const ctx=await getSessionProfile();
 if(!ctx.session||!ctx.profile?.ativo||ctx.profile.role==='pendente'){location.replace('./login.html');return false}
 profile=ctx.profile;
 const [storesR,goalsR,resultsR,nextGoalsR]=await Promise.all([
   supabase.from('lojas').select('id,codigo,nome,ativa').eq('ativa',true).order('nome'),
   supabase.from('metas').select('loja_id,valor_meta').eq('competencia',MONTH),
   supabase.from('resultados').select('loja_id,valor_realizado,data').gte('data',MONTH).lte('data',monthEnd),
   supabase.from('metas').select('loja_id,valor_meta').eq('competencia',NEXT)
 ]);
 const err=storesR.error||goalsR.error||resultsR.error||nextGoalsR.error;if(err)throw err;
 const stores=storesR.data||[], goals=new Map((goalsR.data||[]).map(r=>[r.loja_id,Number(r.valor_meta)]));
 const realized=new Map();(resultsR.data||[]).forEach(r=>realized.set(r.loja_id,(realized.get(r.loja_id)||0)+Number(r.valor_realizado)));
 const nextGoals=new Map((nextGoalsR.data||[]).map(r=>[r.loja_id,Number(r.valor_meta)]));
 storeIds=Object.fromEntries(stores.map(s=>[s.codigo||s.id,s.id]));
 const dados={
   lojas:stores.map(s=>({nome:s.nome,cod:s.codigo||'',meta:goals.get(s.id)||0,real:realized.get(s.id)||0,ticket:130})),
   vendedoras:[],gerentes:[],vendasHoje:{},metasProx:{},mesFechado:false
 };
 stores.forEach(s=>{if(nextGoals.has(s.id))dados.metasProx[s.codigo||s.id]=nextGoals.get(s.id)});
 originalSet.call(localStorage,'metasdd.v1',JSON.stringify(dados));
 return true;
}
async function syncLocal(raw){
 if(!profile||profile.role==='gerente_comercial')return;
 let d;try{d=JSON.parse(raw)}catch{return}
 try{
   const sales=[];for(const [code,obj] of Object.entries(d.vendasHoje||{})){const loja_id=storeIds[code],value=Number(obj?.valor||0);if(loja_id&&value>0)sales.push({loja_id,data:DAY,valor_realizado:value,criado_por:profile.id})}
   if(sales.length){const{error}=await supabase.from('resultados').upsert(sales,{onConflict:'loja_id,data'});if(error)throw error}
   const metas=[];for(const [code,value] of Object.entries(d.metasProx||{})){const loja_id=storeIds[code],n=Number(value||0);if(loja_id&&n>=0)metas.push({loja_id,competencia:NEXT,valor_meta:n,criado_por:profile.id})}
   if(metas.length){const{error}=await supabase.from('metas').upsert(metas,{onConflict:'loja_id,competencia'});if(error)throw error}
   showStatus('Dados sincronizados');
 }catch(e){console.error(e);showStatus('Falha ao sincronizar',3500)}
}
window.addEventListener('storage',e=>{if(e.key==='metasdd.v1'&&e.newValue)syncLocal(e.newValue)});
function personalize(){
 try{
   const doc=frame.contentDocument;if(!doc?.body)return;
   const role=roleLabel(profile.role),ini=initials(profile.nome);
   [...doc.querySelectorAll('div,span')].forEach(el=>{
     const t=(el.textContent||'').trim();
     if(t==='Layane Andrade')el.textContent=profile.nome;
     else if(t==='Supervisora')el.textContent=role;
     else if(t==='LA'&&el.children.length===0)el.textContent=ini;
     if(profile.role==='gerente_comercial'&&['Lançar vendas','Definir metas','Configurações'].includes(t))el.style.display='none';
   });
 }catch{}
}
try{
 const ok=await prepare();if(!ok)throw new Error('Sessão inválida');
 frame.addEventListener('load',()=>{loading.classList.add('hide');personalize();setTimeout(personalize,500);setInterval(personalize,2000)},{once:true});
 frame.src='./Painel%20de%20Metas%20D%26D.dc.html?v=original-20260808';
}catch(e){console.error(e);fail(e.message||String(e))}
</script>
</body>
</html>
