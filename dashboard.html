<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Metas D&D</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#DCE9E7;overflow:hidden}#panel{width:100%;height:100%;border:0;display:block;background:#DCE9E7}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#DCE9E7;color:#0A5F5C;font:700 14px/1.4 system-ui;z-index:20}.loading.hide{display:none}.status{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:30;background:#fff;border:1px solid #EFF4F3;border-radius:999px;padding:9px 13px;font:700 11px/1 system-ui;color:#0A5F5C;box-shadow:0 8px 28px rgba(20,60,55,.14);display:none}.status.on{display:block}.error{max-width:560px;margin:20px;background:#fff;padding:18px 20px;border-radius:16px;color:#b42318;box-shadow:0 18px 50px rgba(20,60,55,.08)}

.profile-overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:12px;background:rgba(25,54,51,.38);backdrop-filter:blur(4px)}
.profile-overlay.open{display:flex}.profile-modal{width:min(360px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:#fff;border-radius:26px;box-shadow:0 28px 80px rgba(18,55,51,.22);font-family:Manrope,system-ui,sans-serif;color:#171d1c}
.profile-head{display:flex;align-items:flex-start;justify-content:space-between;padding:21px 24px 20px;border-bottom:1px solid #edf2f1}.profile-head h2{margin:0;font-size:17px;line-height:1.2}.profile-crumb{margin-top:5px;font-size:11px;color:#96a2a0}.profile-crumb b{color:#07938d}.profile-close{width:34px;height:34px;border:0;border-radius:12px;background:#f2f6f5;color:#697573;cursor:pointer}
.profile-body{padding:24px}.profile-photo{width:132px;height:132px;margin:0 auto;border-radius:28px;background:#0c9993;color:#fff;display:grid;place-items:center;overflow:hidden;font-size:34px;font-weight:800}.profile-photo img{width:100%;height:100%;object-fit:cover}
.profile-photo-action{display:block;margin:14px auto 0;padding:8px 16px;border:0;border-radius:999px;background:#e7f4f2;color:#08736f;font-size:11px;font-weight:700;cursor:pointer}.profile-name{text-align:center;margin:14px 0 0;font-size:19px}.profile-subtitle{text-align:center;margin:4px 0 0;color:#94a09e;font-size:11px}
.profile-badges{display:flex;justify-content:center;gap:8px;margin:15px 0 21px}.profile-badge{padding:7px 11px;border-radius:999px;background:#f3f7f6;color:#6d7977;font:700 10px/1 ui-monospace,monospace}.profile-badge.active{background:#07958f;color:#fff;font-family:inherit}
.profile-info{background:#f4f8f7;border-radius:16px;padding:5px 15px}.profile-row{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid #e8efed;font-size:11px}.profile-row:last-child{border-bottom:0}.profile-row span{color:#99a5a3}.profile-row b{text-align:right;font-size:11px}
.profile-actions{display:grid;gap:8px;margin-top:20px}.profile-btn{border:0;border-radius:12px;padding:12px 14px;background:#f3f7f6;color:#667270;font-weight:700;font-size:11px;cursor:pointer}.profile-btn.logout{background:#fdf0f3;color:#d34c69}.profile-btn i{margin-right:7px}.profile-edit{display:none;margin-top:14px;padding:14px;background:#f4f8f7;border-radius:14px}.profile-edit.open{display:block}.profile-edit label{display:block;font-size:10px;color:#7f8c8a;margin-bottom:6px}.profile-edit input{width:100%;box-sizing:border-box;border:1px solid #d9e6e4;border-radius:10px;padding:10px;background:#fff;outline:none}.profile-edit-actions{display:flex;gap:8px;margin-top:9px}.profile-edit-actions button{flex:1;border:0;border-radius:9px;padding:9px;font-weight:700;cursor:pointer}.profile-save{background:#07958f;color:#fff}.profile-cancel{background:#e7eeed;color:#677371}.profile-msg{min-height:15px;margin-top:8px;text-align:center;font-size:10px;color:#b42318}
@media(max-width:520px){.profile-overlay{align-items:flex-end;padding:0}.profile-modal{width:100%;max-height:92vh;border-radius:26px 26px 0 0}.profile-body{padding:20px 22px}.profile-photo{width:116px;height:116px}}

</style>
</head>
<body>
<div id="loading" class="loading">Carregando seu painel D&D…</div>
<div id="status" class="status"></div>
<iframe id="panel" title="Metas D&D"></iframe>

<div id="profileOverlay" class="profile-overlay" aria-hidden="true">
  <section class="profile-modal" role="dialog" aria-modal="true" aria-labelledby="profileTitle">
    <header class="profile-head"><div><h2 id="profileTitle">Meu perfil</h2><div class="profile-crumb">Painel / <b>Perfil</b></div></div><button id="profileClose" class="profile-close" type="button" aria-label="Fechar"><i class="fa-solid fa-xmark"></i></button></header>
    <div class="profile-body">
      <div id="profilePhoto" class="profile-photo">--</div><button id="profilePhotoAction" class="profile-photo-action" type="button">Inserir foto</button><input id="profilePhotoInput" type="file" accept="image/png,image/jpeg,image/webp" hidden>
      <h3 id="profileName" class="profile-name">—</h3><p id="profileSubtitle" class="profile-subtitle">—</p>
      <div class="profile-badges"><span id="profileCode" class="profile-badge">—</span><span class="profile-badge active">Ativa</span></div>
      <div class="profile-info">
        <div class="profile-row"><span>Perfil de acesso</span><b id="profileRole">—</b></div>
        <div class="profile-row"><span>Lojas sob gestão</span><b id="profileStores">—</b></div>
        <div class="profile-row"><span>Modelo de trabalho</span><b>Híbrido</b></div>
        <div class="profile-row"><span>Na D&amp;D desde</span><b id="profileSince">—</b></div>
      </div>
      <div id="profileEdit" class="profile-edit"><label for="profileNameInput">Nome completo</label><input id="profileNameInput" autocomplete="name"><div class="profile-edit-actions"><button id="profileCancel" class="profile-cancel" type="button">Cancelar</button><button id="profileSave" class="profile-save" type="button">Salvar</button></div><div id="profileMsg" class="profile-msg"></div></div>
      <div class="profile-actions"><button id="profileEditAction" class="profile-btn" type="button">Editar meus dados</button><button id="profileLogout" class="profile-btn logout" type="button"><i class="fa-solid fa-arrow-right-from-bracket"></i>Sair do painel</button></div>
    </div>
  </section>
</div>
<script type="module">
import {supabase,getSessionProfile,roleLabel} from './supabase-client.js';
const frame=document.querySelector('#panel'),loading=document.querySelector('#loading'),status=document.querySelector('#status');
const MONTH='2026-05-01', NEXT='2026-06-01', DAY='2026-05-21';
const monthEnd='2026-05-31';
const originalSet=Storage.prototype.setItem;
let profile=null,sessionUser=null,visibleStores=[],storeIds={};
function showStatus(t,ms=2200){status.textContent=t;status.classList.add('on');setTimeout(()=>status.classList.remove('on'),ms)}
function fail(msg){loading.innerHTML=`<div class="error"><b>Não foi possível abrir o painel.</b><div style="margin-top:8px;font-weight:500">${msg}</div><div style="margin-top:12px"><a href="./login.html">Voltar ao login</a></div></div>`}
function initials(n){return String(n||'').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'--'}
const overlay=document.querySelector('#profileOverlay'),photo=document.querySelector('#profilePhoto'),editBox=document.querySelector('#profileEdit'),profileMsg=document.querySelector('#profileMsg');
const profilePhotoKey=()=>`metasdd.profile-photo.${profile?.id||'guest'}`;
function profileCode(){const prefix=profile?.role==='administrador'?'ADM':profile?.role==='gerente_comercial'?'GER':'SUP';return `${prefix}-${String(profile?.id||'').slice(0,4).toUpperCase()}`}
function renderProfile(){
 if(!profile)return;
 const role=roleLabel(profile.role),saved=localStorage.getItem(profilePhotoKey());
 photo.innerHTML=saved?`<img src="${saved}" alt="Foto de ${String(profile.nome||'perfil').replace(/"/g,'&quot;')}">`:initials(profile.nome);
 document.querySelector('#profileName').textContent=profile.nome||profile.email;
 document.querySelector('#profileSubtitle').textContent=`${role} · Franquias D&D`;
 document.querySelector('#profileCode').textContent=profileCode();
 document.querySelector('#profileRole').textContent=role;
 document.querySelector('#profileStores').textContent=String(visibleStores.length);
 document.querySelector('#profileSince').textContent=sessionUser?.created_at?new Date(sessionUser.created_at).toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'}):'Não informado';
 document.querySelector('#profileNameInput').value=profile.nome||'';
}
function openProfile(){renderProfile();overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');document.querySelector('#profileClose').focus()}
function closeProfile(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');editBox.classList.remove('open');profileMsg.textContent=''}
document.querySelector('#profileClose').onclick=closeProfile;
overlay.addEventListener('click',e=>{if(e.target===overlay)closeProfile()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('open'))closeProfile()});
document.querySelector('#profileEditAction').onclick=()=>{editBox.classList.add('open');document.querySelector('#profileNameInput').focus()};
document.querySelector('#profileCancel').onclick=()=>{editBox.classList.remove('open');profileMsg.textContent=''};
document.querySelector('#profileSave').onclick=async()=>{
 const nome=document.querySelector('#profileNameInput').value.trim();if(nome.length<2){profileMsg.textContent='Informe seu nome completo.';return}
 profileMsg.textContent='Salvando…';const{error}=await supabase.from('profiles').update({nome}).eq('id',profile.id);
 if(error){profileMsg.textContent=error.message||'Não foi possível salvar.';return}
 profile.nome=nome;profileMsg.textContent='Dados atualizados.';renderProfile();personalize();setTimeout(()=>editBox.classList.remove('open'),700)
};
document.querySelector('#profilePhotoAction').onclick=()=>document.querySelector('#profilePhotoInput').click();
document.querySelector('#profilePhotoInput').onchange=e=>{const file=e.target.files?.[0];if(!file)return;if(file.size>2*1024*1024){profileMsg.textContent='Escolha uma imagem de até 2 MB.';return}const reader=new FileReader();reader.onload=()=>{localStorage.setItem(profilePhotoKey(),reader.result);renderProfile()};reader.readAsDataURL(file)};
document.querySelector('#profileLogout').onclick=async()=>{await supabase.auth.signOut({scope:'local'});location.replace('./login.html')};
async function prepare(){
 const ctx=await getSessionProfile();
 if(!ctx.session||!ctx.profile?.ativo||ctx.profile.role==='pendente'){location.replace('./login.html');return false}
 profile=ctx.profile;sessionUser=ctx.session.user;
 const [storesR,goalsR,resultsR,nextGoalsR]=await Promise.all([
   supabase.from('lojas').select('id,codigo,nome,ativa').eq('ativa',true).order('nome'),
   supabase.from('metas').select('loja_id,valor_meta').eq('competencia',MONTH),
   supabase.from('resultados').select('loja_id,valor_realizado,data').gte('data',MONTH).lte('data',monthEnd),
   supabase.from('metas').select('loja_id,valor_meta').eq('competencia',NEXT)
 ]);
 const err=storesR.error||goalsR.error||resultsR.error||nextGoalsR.error;if(err)throw err;
 const stores=storesR.data||[];visibleStores=stores;const goals=new Map((goalsR.data||[]).map(r=>[r.loja_id,Number(r.valor_meta)]));
 const realized=new Map();(resultsR.data||[]).forEach(r=>realized.set(r.loja_id,(realized.get(r.loja_id)||0)+Number(r.valor_realizado)));
 const nextGoals=new Map((nextGoalsR.data||[]).map(r=>[r.loja_id,Number(r.valor_meta)]));
 storeIds=Object.fromEntries(stores.map(s=>[s.codigo||s.id,s.id]));
 const dados={
   lojas:stores.map(s=>({nome:s.nome,cod:s.codigo||'',meta:goals.get(s.id)||0,real:realized.get(s.id)||0,ticket:130})),
   vendedoras:[],gerentes:[],vendasHoje:{},metasProx:{},mesFechado:false
 };
 stores.forEach(s=>{if(nextGoals.has(s.id))dados.metasProx[s.codigo||s.id]=nextGoals.get(s.id)});
 originalSet.call(localStorage,'metasdd.v1',JSON.stringify(dados));
 return true;
}
async function syncLocal(raw){
 if(!profile||profile.role==='gerente_comercial')return;
 let d;try{d=JSON.parse(raw)}catch{return}
 try{
   const sales=[];for(const [code,obj] of Object.entries(d.vendasHoje||{})){const loja_id=storeIds[code],value=Number(obj?.valor||0);if(loja_id&&value>0)sales.push({loja_id,data:DAY,valor_realizado:value,criado_por:profile.id})}
   if(sales.length){const{error}=await supabase.from('resultados').upsert(sales,{onConflict:'loja_id,data'});if(error)throw error}
   const metas=[];for(const [code,value] of Object.entries(d.metasProx||{})){const loja_id=storeIds[code],n=Number(value||0);if(loja_id&&n>=0)metas.push({loja_id,competencia:NEXT,valor_meta:n,criado_por:profile.id})}
   if(metas.length){const{error}=await supabase.from('metas').upsert(metas,{onConflict:'loja_id,competencia'});if(error)throw error}
   showStatus('Dados sincronizados');
 }catch(e){console.error(e);showStatus('Falha ao sincronizar',3500)}
}
window.addEventListener('storage',e=>{if(e.key==='metasdd.v1'&&e.newValue)syncLocal(e.newValue)});
function personalize(){
 try{
   const doc=frame.contentDocument;if(!doc?.body)return;
   const role=roleLabel(profile.role),ini=initials(profile.nome);
   [...doc.querySelectorAll('div,span')].forEach(el=>{
     const t=(el.textContent||'').trim();
     if(t==='Layane Andrade')el.textContent=profile.nome;
     else if(t==='Supervisora')el.textContent=role;
     else if(t==='LA'&&el.children.length===0)el.textContent=ini;
     if((t===profile.nome||t===ini)&&el.children.length===0){el.style.cursor='pointer';el.setAttribute('role','button');el.setAttribute('tabindex','0');el.onclick=openProfile;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openProfile()}}}
     if(profile.role==='gerente_comercial'&&['Lançar vendas','Definir metas','Configurações'].includes(t))el.style.display='none';
   });
 }catch{}
}
try{
 const ok=await prepare();if(!ok)throw new Error('Sessão inválida');
 frame.addEventListener('load',()=>{loading.classList.add('hide');personalize();setTimeout(personalize,500);setInterval(personalize,2000)},{once:true});
 frame.src='./Painel%20de%20Metas%20D%26D.dc.html?v=original-20260808';
}catch(e){console.error(e);fail(e.message||String(e))}
</script>
</body>
</html>
