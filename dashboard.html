<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Metas D&D</title>
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url('./fonts/InterVariableFont_opszwght.ttf') format('truetype')}
@font-face{font-family:'Inter';font-style:italic;font-weight:100 900;font-display:swap;src:url('./fonts/InterItalicVariableFont_opszwght.ttf') format('truetype')}
html,body{margin:0;width:100%;height:100%;background:#DCE9E7;overflow:hidden;font-family:Inter,system-ui,sans-serif}#panel{width:100%;height:100%;border:0;display:block;background:#DCE9E7;opacity:1;transform:scale(1);filter:none;transform-origin:center center;will-change:opacity,transform,filter;transition:opacity .40s ease,transform .40s cubic-bezier(.22,1,.36,1),filter .40s ease}#panel.is-refreshing{opacity:.9;transform:scale(.998);filter:saturate(.96)}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#DCE9E7;color:#0A5F5C;font:700 14px/1.4 Inter,system-ui,sans-serif;z-index:20}.loading.hide{display:none}.loading.soft{inset:auto 22px 22px auto;display:flex;place-items:initial;padding:11px 15px;border:1px solid #DCE9E7;border-radius:999px;background:#fff;box-shadow:0 12px 32px rgba(20,60,55,.16);font-size:12px}.status{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:30;background:#fff;border:1px solid #EFF4F3;border-radius:999px;padding:9px 13px;font:700 11px/1 Inter,system-ui,sans-serif;color:#0A5F5C;box-shadow:0 8px 28px rgba(20,60,55,.14);display:none}.status.on{display:block}.error{max-width:560px;margin:20px;background:#fff;padding:18px 20px;border-radius:16px;color:#b42318;box-shadow:0 18px 50px rgba(20,60,55,.08)}

.import-overlay{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(25,54,51,.42);backdrop-filter:blur(5px)}.import-overlay.open{display:flex}.import-modal{width:min(760px,calc(100vw - 36px));max-height:calc(100vh - 36px);overflow:auto;box-sizing:border-box;padding:24px;background:#fff;border-radius:24px;box-shadow:0 28px 80px rgba(18,55,51,.24);font-family:Inter,system-ui,sans-serif;color:#16211F}.import-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.import-head h2{margin:0;font-size:21px}.import-head p{margin:7px 0 0;color:#667270;font-size:12px;line-height:1.55}.import-close{width:36px;height:36px;flex:none;border:0;border-radius:12px;background:#F2F6F5;color:#5A6664;font-size:20px;cursor:pointer}.import-label{display:block;margin:22px 0 8px;font-size:11px;font-weight:700;color:#5A6664}.import-textarea{width:100%;min-height:160px;resize:vertical;box-sizing:border-box;padding:14px;border:1.5px solid #D8E6E4;border-radius:14px;background:#FBFDFC;color:#16211F;font:500 12px/1.55 ui-monospace,monospace;outline:none}.import-textarea:focus{border-color:#05918C;box-shadow:0 0 0 3px rgba(5,145,140,.12)}.import-preview{display:none;margin-top:16px;padding:14px;border-radius:14px;background:#F4F8F7;font-size:11px;line-height:1.5}.import-preview.open{display:block}.import-preview.error{background:#FDF1F3;color:#A82E4B}.import-preview strong{display:block;margin-bottom:8px;font-size:12px}.import-table{width:100%;border-collapse:collapse;color:#40504D}.import-table th,.import-table td{padding:8px;border-bottom:1px solid #E6EFED;text-align:left}.import-table th{font-size:10px;color:#7B8987;text-transform:uppercase}.import-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.import-actions button{border:0;border-radius:12px;padding:11px 17px;font-weight:700;cursor:pointer}.import-secondary{background:#F1F5F4;color:#5A6664}.import-primary{background:#05918C;color:#fff}.import-primary:disabled{opacity:.45;cursor:not-allowed}@media(max-width:620px){.import-overlay{align-items:flex-end;padding:0}.import-modal{width:100%;max-height:92vh;border-radius:24px 24px 0 0}.import-actions{display:grid;grid-template-columns:1fr 1fr}.import-actions button{width:100%}}@media(prefers-reduced-motion:reduce){#panel{transition:none}}

.profile-overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:12px;background:rgba(25,54,51,.38);backdrop-filter:blur(4px)}
.profile-overlay.open{display:flex}.profile-modal{width:min(360px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:#fff;border-radius:26px;box-shadow:0 28px 80px rgba(18,55,51,.22);font-family:Inter,system-ui,sans-serif;color:#171d1c}
.profile-head{display:flex;align-items:flex-start;justify-content:space-between;padding:21px 24px 20px;border-bottom:1px solid #edf2f1}.profile-head h2{margin:0;font-size:17px;line-height:1.2}.profile-crumb{margin-top:5px;font-size:11px;color:#96a2a0}.profile-crumb b{color:#07938d}.profile-close{width:34px;height:34px;border:0;border-radius:12px;background:#f2f6f5;color:#697573;cursor:pointer;display:grid;place-items:center}.profile-close img{width:18px;height:18px}
.profile-body{padding:24px}.profile-photo{width:132px;height:132px;margin:0 auto;border-radius:28px;background:#0c9993;color:#fff;display:grid;place-items:center;overflow:hidden;font-size:34px;font-weight:800}.profile-photo img{width:100%;height:100%;object-fit:cover}
.profile-photo-action{display:flex;align-items:center;gap:6px;margin:14px auto 0;padding:8px 16px;border:0;border-radius:999px;background:#e7f4f2;color:#08736f;font-size:11px;font-weight:700;cursor:pointer}.profile-name{text-align:center;margin:14px 0 0;font-size:19px}.profile-subtitle{text-align:center;margin:4px 0 0;color:#94a09e;font-size:11px}
.profile-badges{display:flex;justify-content:center;gap:8px;margin:15px 0 21px}.profile-badge{padding:7px 11px;border-radius:999px;background:#f3f7f6;color:#6d7977;font:700 10px/1 ui-monospace,monospace}.profile-badge.active{background:#07958f;color:#fff;font-family:inherit}
.profile-info{background:#f4f8f7;border-radius:16px;padding:5px 15px}.profile-row{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid #e8efed;font-size:11px}.profile-row:last-child{border-bottom:0}.profile-row span{color:#99a5a3}.profile-row b{text-align:right;font-size:11px}
.profile-actions{display:grid;gap:8px;margin-top:20px}.profile-btn{border:0;border-radius:12px;padding:12px 14px;background:#f3f7f6;color:#667270;font-weight:700;font-size:11px;cursor:pointer}.profile-btn.logout{background:#fdf0f3;color:#d34c69}.profile-btn img,.profile-photo-action img{width:16px;height:16px;vertical-align:-3px;margin-right:7px}.profile-photo-action img{margin-right:0;width:14px;height:14px}.profile-edit{display:none;margin-top:14px;padding:14px;background:#f4f8f7;border-radius:14px}.profile-edit.open{display:block}.profile-edit label{display:block;font-size:10px;color:#7f8c8a;margin-bottom:6px}.profile-edit input{width:100%;box-sizing:border-box;border:1px solid #d9e6e4;border-radius:10px;padding:10px;background:#fff;outline:none}.profile-edit-actions{display:flex;gap:8px;margin-top:9px}.profile-edit-actions button{flex:1;border:0;border-radius:9px;padding:9px;font-weight:700;cursor:pointer}.profile-save{background:#07958f;color:#fff}.profile-cancel{background:#e7eeed;color:#677371}.profile-msg{min-height:15px;margin-top:8px;text-align:center;font-size:10px;color:#b42318}
@media(max-width:520px){.profile-overlay{align-items:flex-end;padding:0}.profile-modal{width:100%;max-height:92vh;border-radius:26px 26px 0 0}.profile-body{padding:20px 22px}.profile-photo{width:116px;height:116px}}

</style>
</head>
<body>
<div id="loading" class="loading">Carregando seu painel D&D…</div>
<div id="status" class="status"></div>
<iframe id="panel" title="Metas D&D" allow="clipboard-read; clipboard-write"></iframe>

<div id="profileOverlay" class="profile-overlay" aria-hidden="true">
  <section class="profile-modal" role="dialog" aria-modal="true" aria-labelledby="profileTitle">
    <header class="profile-head"><div><h2 id="profileTitle">Meu perfil</h2><div class="profile-crumb">Painel / <b>Perfil</b></div></div><button id="profileClose" class="profile-close" type="button" aria-label="Fechar"><img src="https://cdn.jsdelivr.net/gh/untitleduico/icons@c42fbd02f365c4388ba32e9f43df0ef4851ba126/icons/x-close.svg" alt="" aria-hidden="true"></button></header>
    <div class="profile-body">
      <div id="profilePhoto" class="profile-photo">--</div><button id="profilePhotoAction" class="profile-photo-action" type="button"><img src="https://cdn.jsdelivr.net/gh/untitleduico/icons@c42fbd02f365c4388ba32e9f43df0ef4851ba126/icons/camera-01.svg" alt="" aria-hidden="true">Inserir foto</button><input id="profilePhotoInput" type="file" accept="image/png,image/jpeg,image/webp" hidden>
      <h3 id="profileName" class="profile-name">—</h3><p id="profileSubtitle" class="profile-subtitle">—</p>
      <div class="profile-badges"><span id="profileCode" class="profile-badge">—</span><span class="profile-badge active">Ativa</span></div>
      <div class="profile-info">
        <div class="profile-row"><span>Perfil de acesso</span><b id="profileRole">—</b></div>
        <div class="profile-row"><span>Lojas sob gestão</span><b id="profileStores">—</b></div>
        <div class="profile-row"><span>Modelo de trabalho</span><b>Híbrido</b></div>
        <div class="profile-row"><span>Na D&amp;D desde</span><b id="profileSince">—</b></div>
      </div>
      <div id="profileEdit" class="profile-edit"><label for="profileNameInput">Nome completo</label><input id="profileNameInput" autocomplete="name"><div class="profile-edit-actions"><button id="profileCancel" class="profile-cancel" type="button">Cancelar</button><button id="profileSave" class="profile-save" type="button">Salvar</button></div><div id="profileMsg" class="profile-msg"></div></div>
      <div class="profile-actions"><button id="profileAdminAction" class="profile-btn" type="button" hidden><img src="https://cdn.jsdelivr.net/gh/untitleduico/icons@c42fbd02f365c4388ba32e9f43df0ef4851ba126/icons/settings-01.svg" alt="" aria-hidden="true">Abrir administração</button><button id="profileEditAction" class="profile-btn" type="button"><img src="https://cdn.jsdelivr.net/gh/untitleduico/icons@c42fbd02f365c4388ba32e9f43df0ef4851ba126/icons/edit-03.svg" alt="" aria-hidden="true">Editar meus dados</button><button id="profileLogout" class="profile-btn logout" type="button"><img src="https://cdn.jsdelivr.net/gh/untitleduico/icons@c42fbd02f365c4388ba32e9f43df0ef4851ba126/icons/log-out-01.svg" alt="" aria-hidden="true">Sair do painel</button></div>
    </div>
  </section>
</div>
<script type="module">
import {supabase,getSessionProfile,roleLabel} from './supabase-client.js';
const frame=document.querySelector('#panel'),overlay=document.querySelector('#profileOverlay'),photo=document.querySelector('#profilePhoto'),editBox=document.querySelector('#profileEdit'),profileMsg=document.querySelector('#profileMsg');
let profile=null,sessionUser=null,visibleStoreCount=0,profileTimer=null;
const initials=n=>String(n||'').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'--';
const profilePhotoKey=()=>`metasdd.profile-photo.${profile?.id||'guest'}`;
const profileCode=()=>{const prefix=profile?.role==='administrador'?'ADM':profile?.role==='gerente_comercial'?'GER':'SUP';return `${prefix}-${String(profile?.id||'').slice(0,4).toUpperCase()}`};
function renderProfile(){
 if(!profile)return;
 const role=roleLabel(profile.role),saved=localStorage.getItem(profilePhotoKey());
 photo.innerHTML=saved?`<img src="${saved}" alt="Foto de ${String(profile.nome||'perfil').replace(/"/g,'&quot;')}">`:initials(profile.nome);
 document.querySelector('#profileName').textContent=profile.nome||profile.email;
 document.querySelector('#profileSubtitle').textContent=`${role} · Franquias D&D`;
 document.querySelector('#profileCode').textContent=profileCode();
 document.querySelector('#profileRole').textContent=role;
 document.querySelector('#profileStores').textContent=String(visibleStoreCount);
 document.querySelector('#profileSince').textContent=sessionUser?.created_at?new Date(sessionUser.created_at).toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'}):'Não informado';
 document.querySelector('#profileNameInput').value=profile.nome||'';
 document.querySelector('#profileAdminAction').hidden=profile.role!=='administrador';
}
function openProfile(){renderProfile();overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');document.querySelector('#profileClose').focus()}
function closeProfile(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');editBox.classList.remove('open');profileMsg.textContent=''}
function personalize(){
 try{
   const doc=frame.contentDocument;if(!doc?.body||!profile)return;
   const role=roleLabel(profile.role),ini=initials(profile.nome),saved=localStorage.getItem(profilePhotoKey());
   [...doc.querySelectorAll('div,span')].forEach(el=>{
     const t=(el.textContent||'').trim();
     if(t==='Layane Andrade')el.textContent=profile.nome;
     else if(t==='Supervisora')el.textContent=role;
     else if(t==='LA'&&el.children.length===0)el.textContent=ini;
     const current=(el.textContent||'').trim(),isAvatar=current==='LA'||current===ini||el.dataset.profileAvatar==='true';
     if(saved&&isAvatar){
       el.dataset.profileAvatar='true';el.innerHTML='<img alt="Foto do perfil">';
       const img=el.querySelector('img');img.src=saved;img.style.cssText='width:100%;height:100%;display:block;object-fit:cover;border-radius:inherit';
       el.style.overflow='hidden';
     }
     if(current===profile.nome||isAvatar){el.style.cursor='pointer';el.setAttribute('role','button');el.setAttribute('tabindex','0');el.onclick=openProfile;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openProfile()}}}
   });
 }catch(e){console.error('perfil',e)}
}
document.querySelector('#profileClose').onclick=closeProfile;
overlay.addEventListener('click',e=>{if(e.target===overlay)closeProfile()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('open'))closeProfile()});
document.querySelector('#profileEditAction').onclick=()=>{editBox.classList.add('open');document.querySelector('#profileNameInput').focus()};
document.querySelector('#profileAdminAction').onclick=()=>location.href='./admin.html';
document.querySelector('#profileCancel').onclick=()=>{editBox.classList.remove('open');profileMsg.textContent=''};
document.querySelector('#profileSave').onclick=async()=>{
 const nome=document.querySelector('#profileNameInput').value.trim();if(nome.length<2){profileMsg.textContent='Informe seu nome completo.';return}
 profileMsg.textContent='Salvando…';const{error}=await supabase.from('profiles').update({nome}).eq('id',profile.id);
 if(error){profileMsg.textContent=error.message||'Não foi possível salvar.';return}
 profile.nome=nome;profileMsg.textContent='Dados atualizados.';renderProfile();personalize();setTimeout(()=>editBox.classList.remove('open'),700)
};
document.querySelector('#profilePhotoAction').onclick=()=>document.querySelector('#profilePhotoInput').click();
document.querySelector('#profilePhotoInput').onchange=e=>{const file=e.target.files?.[0];if(!file)return;if(file.size>2*1024*1024){profileMsg.textContent='Escolha uma imagem de até 2 MB.';return}const reader=new FileReader();reader.onload=()=>{localStorage.setItem(profilePhotoKey(),reader.result);renderProfile();personalize()};reader.readAsDataURL(file)};
document.querySelector('#profileLogout').onclick=async()=>{await supabase.auth.signOut({scope:'local'});location.replace('./login.html')};
try{
 const ctx=await getSessionProfile();
 if(!ctx.session||!ctx.profile?.ativo||ctx.profile.role==='pendente')throw new Error('Sessão inválida');
 profile=ctx.profile;sessionUser=ctx.session.user;
 const {count}=await supabase.from('lojas').select('id',{count:'exact',head:true}).eq('ativa',true);visibleStoreCount=count||0;
 renderProfile();
 frame.addEventListener('load',()=>{personalize();setTimeout(personalize,450);clearInterval(profileTimer);profileTimer=setInterval(personalize,1800)});
 if(frame.contentDocument?.body)personalize();
}catch(e){console.error('perfil',e)}
</script>
<script type="module" src="./dashboard-backend-v3.js?v=20260810-operacional1"></script>

<script type="module" src="./dashboard-ano.js?v=20260809-interacoes7"></script>
<script type="module" src="./dashboard-auditoria.js?v=20260809-interacoes7"></script>
<script type="module" src="./dashboard-importacao.js?v=20260810-operacional1"></script>
<script type="module" src="./dashboard-relatorios.js?v=20260809-interacoes7"></script>
<script type="module" src="./dashboard-configuracoes.js?v=20260809-calendario1"></script>
<script type="module" src="./dashboard-fluid.js?v=20260809-interacoes7"></script>
</body>
</html>
