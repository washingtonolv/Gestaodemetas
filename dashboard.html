<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Metas D&D</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#DCE9E7;overflow:hidden}
#panel{width:100%;height:100%;border:0;display:block;background:#DCE9E7}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:#DCE9E7;color:#0A5F5C;font:700 14px/1.4 system-ui;z-index:20}.loading.hide{display:none}
.status{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:30;background:#fff;border:1px solid #EFF4F3;border-radius:999px;padding:9px 13px;font:700 11px/1 system-ui;color:#0A5F5C;box-shadow:0 8px 28px rgba(20,60,55,.14);display:none;max-width:calc(100vw - 28px);text-align:center}.status.on{display:block}.status[data-kind="error"]{color:#B42318}.status[data-kind="warn"]{color:#8A5A00}
.error{max-width:560px;margin:20px;background:#fff;padding:18px 20px;border-radius:16px;color:#b42318;box-shadow:0 18px 50px rgba(20,60,55,.08)}
</style>
</head>
<body>
<div id="loading" class="loading">Conectando ao banco e carregando seu painel D&D…</div>
<div id="status" class="status" aria-live="polite"></div>
<iframe id="panel" title="Metas D&D" allow="clipboard-read; clipboard-write"></iframe>
<script type="module" src="./dashboard-backend-v3.js"></script>
<script type="module" src="./month-selector.js"></script>
<script type="module" src="./dashboard-competencias.js"></script>
<script type="module" src="./dashboard-vendedoras.js"></script>
<script type="module" src="./dashboard-ano.js"></script>
<script type="module" src="./dashboard-auditoria.js"></script>
<script type="module" src="./dashboard-importacao.js"></script>
<script type="module" src="./dashboard-relatorios.js"></script>
</body>
</html>
