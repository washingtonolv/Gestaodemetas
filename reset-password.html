<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redefinir senha — Metas D&D</title><style>:root{--p:#05918C;--text:#183333;--muted:#6b7b7b}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#edf7f6,#fff);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(440px,100%);background:#fff;border:1px solid #dfe9e8;border-radius:24px;padding:32px;box-shadow:0 24px 60px #0b4d4930}.mark{width:46px;height:46px;border-radius:14px;background:var(--p);display:grid;place-items:center;color:#fff;font-weight:900}.brand{display:flex;gap:12px;align-items:center;margin-bottom:26px}.brand h1{font-size:20px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}label{display:block;font-size:13px;font-weight:700;margin:16px 0 7px}input{width:100%;padding:14px 15px;border-radius:12px;border:1px solid #ccdada;font:inherit;outline:none}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:var(--p);color:#fff;font-weight:800;cursor:pointer}.msg{min-height:22px;margin-top:14px;font-size:13px}.err{color:#b42318}.ok{color:#067647}</style></head><body><main class="card"><div class="brand"><div class="mark">D&D</div><div><h1>Redefinir senha</h1><p>Gestão de Metas</p></div></div><form id="form"><label>Nova senha</label><input id="p1" type="password" minlength="8" required autocomplete="new-password"><label>Confirmar senha</label><input id="p2" type="password" minlength="8" required autocomplete="new-password"><button type="submit">Salvar nova senha</button><div id="msg" class="msg"></div></form></main><script type="module">import{ supabase }from'./supabase-client.js';const f=document.querySelector('#form'),m=document.querySelector('#msg');f.addEventListener('submit',async e=>{e.preventDefault();const a=document.querySelector('#p1').value,b=document.querySelector('#p2').value;if(a.length<8||a!==b){m.className='msg err';m.textContent='As senhas devem coincidir e ter no mínimo 8 caracteres.';return}const{error}=await supabase.auth.updateUser({password:a});if(error){m.className='msg err';m.textContent=error.message;return}m.className='msg ok';m.textContent='Senha alterada. Redirecionando…';setTimeout(()=>location.replace('./login.html'),1200)});</script></body></html>
