<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redefinir Senha — Metas D&D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url('./fonts/InterVariableFont_opszwght.ttf') format('truetype')}
:root{--p:#05918C;--p-dark:#0A5F5C;--a:#CD4664;--text:#16211F;--muted:#667270;--line:#dfe9e8;--bg:#DCE9E7}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#DCE9E7,#F4F8F7);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(440px,100%);background:#fff;border:1px solid rgba(255,255,255,.8);border-radius:24px;padding:32px;box-shadow:0 24px 60px rgba(10,95,92,.12)}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:28px}
.mark{position:relative;width:46px;height:46px;border-radius:14px;background:var(--p);display:grid;place-items:center;color:white;font-weight:800;font-size:14px}
.flower{position:absolute;right:-5px;top:-6px;width:12px;height:12px;border-radius:50%;background:var(--a);border:2.5px solid #fff}
.brand h1{font-size:20px;margin:0;letter-spacing:-.02em}
.brand p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
label{display:block;font-size:12.5px;font-weight:700;margin:17px 0 7px;color:#354442}
input{width:100%;padding:13px 15px;border-radius:12px;border:1.5px solid #ccdada;font:inherit;outline:none;transition:border-color .30s ease,box-shadow .30s ease}
input:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(5,145,140,.12)}
.submit{width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;background:var(--p);color:#fff;font-weight:800;font-size:13.5px;cursor:pointer;transition:background .30s ease,opacity .30s ease,transform .2s ease}
.submit:hover:not(:disabled){background:var(--p-dark);transform:translateY(-1px)}
.submit:disabled{opacity:.6;cursor:wait}
.msg{min-height:22px;margin-top:14px;font-size:12.5px}
.err{color:#b42318;font-weight:600}
.ok{color:#067647;font-weight:600}
.back-link{display:block;margin-top:20px;text-align:center;font-size:12.5px;font-weight:700;color:var(--p-dark);text-decoration:none}
.back-link:hover{text-decoration:underline}
</style>
</head>
<body>
<main class="card">
<div class="brand"><div class="mark">D&D<span class="flower"></span></div><div><h1>Redefinir senha</h1><p>Gestão de Metas</p></div></div>
<form id="form">
  <label for="p1">Nova senha</label>
  <input id="p1" type="password" minlength="8" required autocomplete="new-password" placeholder="Mínimo 8 caracteres">
  <label for="p2">Confirmar nova senha</label>
  <input id="p2" type="password" minlength="8" required autocomplete="new-password" placeholder="Repita a senha">
  <button id="btn" class="submit" type="submit">Salvar nova senha</button>
  <div id="msg" class="msg" aria-live="polite"></div>
  <a href="./login.html" class="back-link">← Voltar para o login</a>
</form>
</main>
<script type="module">
import {supabase} from './supabase-client.js';
const f=document.querySelector('#form'),m=document.querySelector('#msg'),b=document.querySelector('#btn');
f.addEventListener('submit',async e=>{
 e.preventDefault();m.textContent='';b.disabled=true;b.textContent='Salvando…';
 const p1=document.querySelector('#p1').value,p2=document.querySelector('#p2').value;
 if(p1.length<8||p1!==p2){m.className='msg err';m.textContent='As senhas devem coincidir e ter no mínimo 8 caracteres.';b.disabled=false;b.textContent='Salvar nova senha';return}
 const {error}=await supabase.auth.updateUser({password:p1});
 if(error){m.className='msg err';m.textContent=error.message||'Falha ao atualizar senha.';b.disabled=false;b.textContent='Salvar nova senha';return}
 m.className='msg ok';m.textContent='Senha atualizada com sucesso! Redirecionando…';
 setTimeout(()=>location.replace('./login.html'),1400);
});
</script>
</body></html>
