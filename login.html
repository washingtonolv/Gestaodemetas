<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestão de Metas D&D — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url('./fonts/InterVariableFont_opszwght.ttf') format('truetype')}
:root{--p:#05918C;--p-dark:#0A5F5C;--a:#CD4664;--text:#16211F;--muted:#667270;--line:#dfe9e8;--bg:#DCE9E7}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#DCE9E7,#F4F8F7);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(440px,100%);background:#fff;border:1px solid rgba(255,255,255,.8);border-radius:24px;padding:32px;box-shadow:0 24px 60px rgba(10,95,92,.12)}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:28px}
.mark{position:relative;width:46px;height:46px;border-radius:14px;background:var(--p);display:grid;place-items:center;color:white;font-weight:800;font-size:14px}
.flower{position:absolute;right:-5px;top:-6px;width:12px;height:12px;border-radius:50%;background:var(--a);border:2.5px solid #fff}
.brand h1{font-size:20px;margin:0;letter-spacing:-.02em}
.brand p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.access-label{display:block;font-size:12px;font-weight:700;margin-bottom:8px;color:#5A6664}
.login-modes{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px;border-radius:14px;background:#F1F6F5}
.mode-button{min-height:42px;border:0;border-radius:10px;background:transparent;color:var(--muted);font:700 12.5px/1 inherit;cursor:pointer;transition:background .30s ease,color .30s ease,box-shadow .30s ease}
.mode-button.active{background:#fff;color:var(--p-dark);box-shadow:0 4px 14px rgba(23,62,59,.1)}
.mode-button:focus-visible,.submit:focus-visible{outline:3px solid rgba(5,145,140,.25);outline-offset:2px}
label{display:block;font-size:12.5px;font-weight:700;margin:17px 0 7px;color:#354442}
input[type="text"],input[type="email"],input[type="password"]{width:100%;padding:13px 15px;border-radius:12px;border:1.5px solid #ccdada;font:inherit;outline:none;transition:border-color .30s ease,box-shadow .30s ease}
input[type="text"]:focus,input[type="email"]:focus,input[type="password"]:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(5,145,140,.12)}
.hint{min-height:17px;margin:6px 2px 0;color:var(--muted);font-size:11px}
.row-options{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;font-size:12px;color:var(--muted)}
.remember-toggle{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;font-weight:600}
.remember-toggle input{accent-color:var(--p);cursor:pointer}
.forgot-link{color:var(--p-dark);text-decoration:none;font-weight:700;transition:color .2s ease}
.forgot-link:hover{color:var(--p);text-decoration:underline}
.submit{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:var(--p);color:#fff;font-weight:800;font-size:13.5px;cursor:pointer;transition:background .30s ease,opacity .30s ease,transform .2s ease}
.submit:hover:not(:disabled){background:var(--p-dark);transform:translateY(-1px)}
.submit:disabled{opacity:.6;cursor:wait}
.msg{min-height:22px;margin-top:14px;font-size:12.5px}
.error{color:#b42318;font-weight:600}
.foot{margin-top:24px;font-size:11.5px;color:var(--muted);text-align:center}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="card">
<div class="brand"><div class="mark">D&D<span class="flower"></span></div><div><h1>Gestão de Metas</h1><p>Acesso multiusuário</p></div></div>
<div class="access-label">Acessar com</div>
<div class="login-modes" role="group" aria-label="Forma de acesso">
  <button class="mode-button active" type="button" data-mode="email" aria-pressed="true">E-mail</button>
  <button class="mode-button" type="button" data-mode="login" aria-pressed="false">Login personalizado</button>
</div>
<form id="loginForm">
  <label id="identifierLabel" for="identifier">E-mail</label>
  <input id="identifier" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="seu@email.com" required>
  <p id="identifierHint" class="hint">Use o e-mail cadastrado.</p>
  <label for="password">Senha</label>
  <input id="password" type="password" autocomplete="current-password" required>
  <div class="row-options">
    <label class="remember-toggle" style="margin:0"><input id="rememberMe" type="checkbox" checked> Lembrar meu acesso</label>
    <a href="./reset-password.html" class="forgot-link">Esqueci a senha</a>
  </div>
  <button id="btn" class="submit" type="submit">Entrar</button>
  <div id="msg" class="msg" aria-live="polite"></div>
</form>
<div class="foot">Administrador • Gerente Comercial • Supervisor</div>
</main>
<script type="module">
import {supabase,getSessionProfile} from './supabase-client.js';
const form=document.querySelector('#loginForm'),msg=document.querySelector('#msg'),btn=document.querySelector('#btn'),identifier=document.querySelector('#identifier'),identifierLabel=document.querySelector('#identifierLabel'),identifierHint=document.querySelector('#identifierHint'),rememberMe=document.querySelector('#rememberMe'),modeButtons=[...document.querySelectorAll('.mode-button')];
let mode='email';

const savedIdentifier=localStorage.getItem('metasdd.saved_identifier')||'';
const savedMode=localStorage.getItem('metasdd.saved_mode')||'email';

function setMode(next){
 mode=next;
 modeButtons.forEach(button=>{const active=button.dataset.mode===mode;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active))});
 const byEmail=mode==='email';
 identifierLabel.textContent=byEmail?'E-mail':'Login personalizado';
 identifier.type=byEmail?'email':'text';
 identifier.placeholder=byEmail?'seu@email.com':'insira seu login';
 identifierHint.textContent=byEmail?'Use o e-mail cadastrado.':'Use o login definido no cadastro do usuário.';
 identifier.value=mode===savedMode?savedIdentifier:'';
 msg.textContent='';
 identifier.focus();
}

if(savedMode&&['email','login'].includes(savedMode))setMode(savedMode);
if(savedIdentifier)identifier.value=savedIdentifier;

modeButtons.forEach(button=>button.addEventListener('click',()=>setMode(button.dataset.mode)));

const destination=profile=>profile?.role==='administrador'?'./admin.html':'./dashboard.html';
try{const {session,profile}=await getSessionProfile();if(session&&profile?.ativo&&profile.role!=='pendente')location.replace(destination(profile));}catch{}

form.addEventListener('submit',async e=>{
 e.preventDefault();msg.textContent='';btn.disabled=true;btn.textContent='Entrando...';
 const value=identifier.value.trim().toLowerCase(),password=document.querySelector('#password').value;
 try{
   if(rememberMe.checked){
     localStorage.setItem('metasdd.saved_identifier',value);
     localStorage.setItem('metasdd.saved_mode',mode);
   }else{
     localStorage.removeItem('metasdd.saved_identifier');
     localStorage.removeItem('metasdd.saved_mode');
   }

   if(mode==='email'){
     const {error}=await supabase.auth.signInWithPassword({email:value,password});
     if(error)throw error;
   }else{
     const {data,error}=await supabase.functions.invoke('login-personalizado',{body:{login:value,password}});
     if(error||data?.error||!data?.access_token||!data?.refresh_token)throw error||new Error(data?.error||'Acesso inválido');
     const {error:setSessionError}=await supabase.auth.setSession({access_token:data.access_token,refresh_token:data.refresh_token});
     if(setSessionError)throw setSessionError;
   }

   const {profile}=await getSessionProfile();
   if(!profile?.ativo||profile.role==='pendente'){
     await supabase.auth.signOut();
     msg.className='msg error';msg.textContent='Seu acesso ainda não foi liberado pelo Administrador.';
     return;
   }
   location.replace(destination(profile));
 }catch{
   await supabase.auth.signOut({scope:'local'}).catch(()=>{});
   msg.className='msg error';msg.textContent='E-mail, login ou senha inválidos.';
 }finally{
   btn.disabled=false;btn.textContent='Entrar';
 }
});
</script>
</body></html>
