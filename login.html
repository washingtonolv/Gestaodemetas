<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestão de Metas D&D — Login</title>
<style>
:root{--p:#05918C;--a:#CD4664;--bg:#f6f8f8;--text:#183333;--muted:#6b7b7b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#edf7f6,#fff);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(440px,100%);background:#fff;border:1px solid #dfe9e8;border-radius:24px;padding:32px;box-shadow:0 24px 60px #0b4d4930}.brand{display:flex;gap:12px;align-items:center;margin-bottom:28px}.mark{width:46px;height:46px;border-radius:14px;background:var(--p);display:grid;place-items:center;color:white;font-weight:900}.brand h1{font-size:20px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}label{display:block;font-size:13px;font-weight:700;margin:16px 0 7px}input{width:100%;padding:14px 15px;border-radius:12px;border:1px solid #ccdada;font:inherit;outline:none}input:focus{border-color:var(--p);box-shadow:0 0 0 3px #05918c18}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:var(--p);color:#fff;font-weight:800;cursor:pointer}button:disabled{opacity:.6}.msg{min-height:22px;margin-top:14px;font-size:13px}.error{color:#b42318}.ok{color:#067647}.foot{margin-top:22px;font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<main class="card">
  <div class="brand"><div class="mark">D&D</div><div><h1>Gestão de Metas</h1><p>Acesso multiusuário</p></div></div>
  <form id="loginForm">
    <label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required>
    <label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required>
    <button id="btn" type="submit">Entrar</button>
    <div id="msg" class="msg" aria-live="polite"></div>
  </form>
  <div class="foot">Administrador • Gerente Comercial • Supervisor</div>
</main>
<script type="module">
import { supabase, getSessionProfile } from './supabase-client.js';
const form=document.querySelector('#loginForm'),msg=document.querySelector('#msg'),btn=document.querySelector('#btn');
try{const {session,profile}=await getSessionProfile();if(session&&profile?.ativo&&profile.role!=='pendente') location.replace('./portal.html');}catch{}
form.addEventListener('submit',async(e)=>{e.preventDefault();msg.textContent='';btn.disabled=true;btn.textContent='Entrando...';
 const email=document.querySelector('#email').value.trim();const password=document.querySelector('#password').value;
 const {error}=await supabase.auth.signInWithPassword({email,password});
 if(error){msg.className='msg error';msg.textContent='E-mail ou senha inválidos.';btn.disabled=false;btn.textContent='Entrar';return;}
 try{const {profile}=await getSessionProfile();if(!profile?.ativo||profile.role==='pendente'){await supabase.auth.signOut();msg.className='msg error';msg.textContent='Seu acesso ainda não foi liberado pelo Administrador.';btn.disabled=false;btn.textContent='Entrar';return;}location.replace('./portal.html');}
 catch(err){msg.className='msg error';msg.textContent='Não foi possível carregar seu perfil.';btn.disabled=false;btn.textContent='Entrar';}
});
</script>
</body></html>
